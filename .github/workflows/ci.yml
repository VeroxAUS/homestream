name: CI

on:
  push:
    branches: [main]
    # The generated wiki is merged by its own workflow; it changes no code.
    paths-ignore: ['droid-wiki/**']
  pull_request:
    paths-ignore: ['droid-wiki/**']
  workflow_dispatch:

# Only pull request runs are superseded. Every run on main must finish to leave its timing record, and a pending run in
# a shared group is replaced by the next one, so each main run gets a group of its own.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PNPM_VERSION: '12.18.0'
  GITLEAKS_VERSION: '8.30.1'
  TURBO_TELEMETRY_DISABLED: '1'
  HOMESTREAM_TELEMETRY: 'off'

jobs:
  # The job names below ("Linux", "Windows") are the required status checks of branch protection on main.
  # Renaming a job means updating the protection rule, otherwise pushes are blocked.
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the full history.
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Use a runner temp directory for test files
        shell: bash
        run: echo "HOMESTREAM_TEST_ROOT=${{ runner.temp }}/homestream-tests" >> "$GITHUB_ENV"

      - name: Restore the turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      # apt mirrors are sometimes slow: every attempt has its own time limit and a failed one is retried after a pause.
      - name: Install ffmpeg (software only; the tests that run it need no GPU)
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt_opts='-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20'
          for attempt in 1 2 3; do
            if timeout 150 sudo apt-get $apt_opts update -qq && timeout 200 sudo apt-get $apt_opts install -y -qq --no-install-recommends ffmpeg; then
              exit 0
            fi
            echo "apt attempt $attempt failed"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $archive\$" checksums.txt | sha256sum --check -)
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Dead code (knip)
        run: pnpm knip

      - name: Duplicate code (jscpd)
        run: pnpm dup

      - name: Module boundaries (dependency-cruiser)
        run: pnpm deps:check

      - name: Dependency version drift (syncpack)
        run: pnpm syncpack:lint

      - name: Large files
        run: pnpm check:large-files

      - name: Bundle budgets (size-limit for the web UI and the desktop main process)
        run: |
          pnpm --filter @homestream/web build
          pnpm --filter @homestream/web size
          pnpm --filter @homestream/desktop build
          pnpm --filter @homestream/desktop size

      - name: AGENTS.md, skills and runbooks name real commands
        run: pnpm agents:check

      - name: Markdown links and anchors
        run: pnpm docs:check

      - name: OpenAPI export is current
        run: pnpm openapi:check

      - name: Database schema docs are current
        run: pnpm db:schema:check

      - name: Feature flags
        run: pnpm flags:check

      - name: Tech debt budget
        run: pnpm techdebt

      - name: .env.example lists every known key
        run: pnpm --filter @homestream/server exec vitest run --project unit test/envExample.test.ts

      # Unit and integration tiers only: GPU (test/encode) and live (test/live) tests never run in CI, and no secret is
      # passed to this job. CI=true makes vitest retry twice and write the JUnit, JSON and flaky reports.
      - name: Tests with coverage thresholds
        run: pnpm test:coverage

      - name: Merge test reports
        if: ${{ !cancelled() }}
        run: node scripts/test-report.mjs --merge-only

      - name: Job summary (coverage, flaky tests, slowest tests)
        if: ${{ !cancelled() }}
        run: node scripts/ci-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Secret scan of the full history (gitleaks)
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts="--all"

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            reports/junit.xml
            reports/vitest.json
            reports/flaky.json
            reports/test-timing.md
            apps/*/coverage/coverage-summary.json
            packages/*/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

  # Browser end-to-end tests of the web UI against the built UI and an isolated server with stub TMDB, gateway, Sentry and
  # PostHog (no keys, no playback). It runs next to Linux and Windows, so it does not lengthen the pipeline. Chromium is
  # installed here and nowhere else. Not a required check: a flaky browser must not block a docs fix.
  e2e:
    name: Web e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the server (the web UI is built by the test command)
        run: pnpm --filter @homestream/server build

      - name: Restore the Chromium download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium and its system libraries
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @homestream/web exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "playwright install attempt $attempt failed"
            sleep $((attempt * 15))
          done
          exit 1

      - name: End-to-end tests
        run: pnpm --filter @homestream/web test:e2e

      - name: Upload the Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/reports/e2e-report
            apps/web/reports/e2e-results
          if-no-files-found: warn
          retention-days: 14

  # Timing record and feedback, after the other jobs of this run have finished. It is not a required check and it cannot
  # fail the run: continue-on-error keeps the run green when the API, the ci-metrics branch or the comment is unavailable,
  # and no job depends on it. On main it commits one JSON file per run to the orphan branch ci-metrics (never to main);
  # on pull requests it keeps one sticky comment up to date. Details: docs/ci.md.
  timing:
    name: CI timing
    needs: [linux, e2e, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Download the test reports of the Linux job
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-reports
          path: ci-artifacts

      - name: Record the timings and compare them with main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-timing.mjs --exclude-job "CI timing" --reports ci-artifacts/reports

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Use a runner temp directory for test files
        shell: bash
        run: echo "HOMESTREAM_TEST_ROOT=${{ runner.temp }}/homestream-tests" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The server runs on Windows, so the pure modules that touch paths and processes are checked there too.
      - name: Server unit tests (config, redact, playlist, decision, ffmpegArgs, db)
        run: >-
          pnpm --filter @homestream/server exec vitest run --project unit
          test/config.test.ts test/redact.test.ts test/playback/playlist.test.ts
          test/playback/decision.test.ts test/playback/ffmpegArgs.test.ts test/db.test.ts

      # The one test that starts the real Electron shell: it launches the built app with the built server and web UI,
      # drives it over DevTools and quits it with --quit. It needs a desktop session, which this runner has.
      - name: Build the app, server and web UI for the Electron smoke test
        shell: bash
        run: |
          pnpm --filter @homestream/server build
          pnpm --filter @homestream/web build
          pnpm --filter @homestream/desktop build

      - name: Electron launch smoke test
        shell: bash
        env:
          ELECTRON_CACHE: ${{ runner.temp }}\electron-cache
        run: |
          node apps/desktop/node_modules/electron/install.js
          pnpm --filter @homestream/desktop smoke
