name: Droid Wiki Refresh

on:
  # Once a day (~03:00 AEST) instead of on every push: a full wiki run is slow
  # and costs Factory credits, and most pushes do not change what the wiki says.
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Refresh even when main has no changes outside droid-wiki/ since the last successful run'
        type: boolean
        default: false

# The job that runs /wiki is read-only: the agent reads the whole repository
# and the pages restored from the rolling branch, so it must not be able to
# push or to open pull requests. The wiki-publish job carries the write
# permissions.
permissions:
  contents: read

env:
  # Rolling branch that carries the generated wiki from one run to the next.
  WIKI_BRANCH: factory/droid-wiki

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether the wiki needs a refresh
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          should_run=true
          if [ "$FORCE" = "true" ]; then
            echo "force=true: refreshing the wiki."
          else
            last_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/droid-wiki-refresh.yml/runs?status=success&branch=$DEFAULT_BRANCH&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
            if [ -z "$last_sha" ]; then
              echo "No previous successful run: refreshing the wiki."
            elif ! git cat-file -e "$last_sha^{commit}" 2>/dev/null; then
              echo "Last successful run's commit $last_sha is not in the history: refreshing the wiki."
            else
              changed=$(git log --oneline "$last_sha..HEAD" -- . ':!droid-wiki')
              if [ -n "$changed" ]; then
                echo "Changes outside droid-wiki/ since $last_sha:"
                echo "$changed"
              else
                echo "No changes outside droid-wiki/ since $last_sha: skipping the refresh."
                should_run=false
              fi
            fi
          fi
          echo "should_run=$should_run" | tee -a "$GITHUB_OUTPUT"

  wiki-refresh:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    # One refresh at a time for the whole repository: the wiki is per repo, so
    # the group must not vary by branch or run.
    concurrency:
      group: droid-wiki-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: /wiki diffs against the commit the previous wiki
          # was generated from to update only the affected pages.
          fetch-depth: 0

      - name: Restore the previous wiki from the rolling branch
        # Copies only droid-wiki/ into the working tree, without switching
        # branches. Without the branch, the wiki committed on main is used.
        run: |
          if git fetch origin "$WIKI_BRANCH" 2>/dev/null && git checkout FETCH_HEAD -- droid-wiki; then
            echo "Restored droid-wiki/ from $WIKI_BRANCH; the wiki refresh updates only the pages whose code changed."
          else
            echo "No previous wiki on $WIKI_BRANCH; starting from droid-wiki/ as checked out."
          fi

      - name: Install Factory Droid
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Generate wiki
        run: droid exec --auto high "/wiki"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}

      - name: Hand the wiki to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: droid-wiki
          # The pages and their metadata only: the video overview and the
          # screenshots stay out of git. The hidden .wiki-meta.json is what
          # makes the next refresh incremental.
          path: |
            droid-wiki
            !droid-wiki/video/**
            !droid-wiki/images/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  wiki-publish:
    needs: wiki-refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    concurrency:
      group: droid-wiki-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pick up the generated wiki
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: droid-wiki
          path: ${{ runner.temp }}/droid-wiki-artifact

      - name: Mirror the generated wiki into the checkout
        # Copying the artifact over the checkout would keep every page the generator dropped (page-plan.json marks
        # them for removal). The checkout's droid-wiki/ is replaced instead, so those pages become deletions in the pull
        # request; video/ and images/ stay untouched because they are never part of the artifact or of git.
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/droid-wiki-artifact
        run: node scripts/wiki-mirror.mjs "$ARTIFACT_DIR" droid-wiki

      - name: Open or update the wiki pull request
        id: wiki-pr
        # The wiki is already generated by this point, so a rejected push or
        # pull request must not fail the run; the next step reports it as a
        # warning annotation.
        continue-on-error: true
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          # FACTORY_WIKI_PR_TOKEN is optional: contents: write and
          # pull-requests: write on this repository. Pull requests opened with
          # the GITHUB_TOKEN fallback do not trigger other workflows, so
          # required checks will not run on the wiki pull request.
          token: ${{ secrets.FACTORY_WIKI_PR_TOKEN || github.token }}
          branch: ${{ env.WIKI_BRANCH }}
          base: ${{ github.event.repository.default_branch }}
          # Git pathspecs; `:!` excludes the same two folders as the upload.
          add-paths: |
            droid-wiki/**
            :!droid-wiki/video/**
            :!droid-wiki/images/**
          commit-message: 'docs: refresh wiki'
          title: 'docs: refresh wiki'
          body: 'Generated by Droid Wiki Refresh and merged automatically. Never hand-edit droid-wiki/.'
          labels: droid-wiki

      - name: Report when the wiki could not be pushed
        if: steps.wiki-pr.outcome == 'failure'
        run: |
          echo "::warning::Could not push droid-wiki/ to $WIKI_BRANCH or open the pull request. The wiki was still generated, but the next run has no previous wiki on that branch to start from. Check the branch rules on $WIKI_BRANCH and the contents/pull-requests permissions of the token, and that Actions may create pull requests."

      - name: Mark the code checks as not applicable to the wiki pull request
        id: wiki-checks
        # Branch protection on main requires the CI jobs below. CI ignores droid-wiki/** (ci.yml paths-ignore) and a
        # pull request opened with the GITHUB_TOKEN triggers no workflow at all, so those checks would stay pending
        # and auto-merge would wait forever. The pull request only touches droid-wiki/** (add-paths above), which no
        # check covers, so the checks are reported as passed on its head commit. Keep REQUIRED_CHECKS equal to the
        # job names in ci.yml and to the required checks of the branch protection rule.
        if: steps.wiki-pr.outcome == 'success' && steps.wiki-pr.outputs.pull-request-head-sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.wiki-pr.outputs.pull-request-head-sha }}
          REQUIRED_CHECKS: Linux,Windows
        run: |
          IFS=, read -ra checks <<< "$REQUIRED_CHECKS"
          for check in "${checks[@]}"; do
            gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f state=success -f context="$check" \
              -f description="Not applicable: this pull request only changes the generated droid-wiki/ folder"
          done

      - name: Merge the wiki pull request
        id: wiki-merge
        # Squash-merges and keeps factory/droid-wiki, which the next run
        # restores the previous wiki from. A protected base branch gets
        # auto-merge (needs allow_auto_merge); an unprotected one merges now.
        if: steps.wiki-pr.outcome == 'success' && steps.wiki-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.FACTORY_WIKI_PR_TOKEN || github.token }}
          PR_NUMBER: ${{ steps.wiki-pr.outputs.pull-request-number }}
          BASE: ${{ github.event.repository.default_branch }}
          HAS_WIKI_PR_TOKEN: ${{ secrets.FACTORY_WIKI_PR_TOKEN != '' }}
        run: |
          echo "pushes_start_workflows=$HAS_WIKI_PR_TOKEN" >> "$GITHUB_OUTPUT"
          protected=$(gh api "repos/$GITHUB_REPOSITORY/branches/$BASE" --jq .protected || echo false)
          flags=--squash
          if [ "$protected" = "true" ]; then
            flags="--squash --auto"
          fi
          # shellcheck disable=SC2086
          if gh pr merge "$PR_NUMBER" $flags --repo "$GITHUB_REPOSITORY"; then
            echo "Wiki pull request #$PR_NUMBER merge requested ($flags)."
          else
            echo "::warning::Could not merge wiki pull request #$PR_NUMBER ($flags). Merge it by hand or check branch protection and the auto-merge setting."
          fi

      - name: Post the push summary for the wiki merge commit
        # A merge made with the GITHUB_TOKEN starts no workflow, so droid-review.yml never sees this push. The same
        # script runs here instead, with the key left out on purpose: the merge only touches droid-wiki/, which the
        # script excludes, so it posts the short "no reviewable changes" summary and never calls Droid. With the
        # optional FACTORY_WIKI_PR_TOKEN the merge does start droid-review.yml, so this step stays out of its way.
        if: >-
          steps.wiki-merge.outcome == 'success' && steps.wiki-merge.outputs.pushes_start_workflows != 'true' &&
          steps.wiki-pr.outputs.pull-request-number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.wiki-pr.outputs.pull-request-number }}
        run: |
          # Auto-merge completes some seconds after the request, once the statuses above are seen.
          state=
          sha=
          deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$deadline" ]; do
            read -r state sha < <(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,mergeCommit \
              --jq '.state + " " + (.mergeCommit.oid // "")' || true) || true
            if [ "${state:-}" = "MERGED" ] && [ -n "${sha:-}" ]; then
              break
            fi
            sleep 10
          done
          if [ "${state:-}" != "MERGED" ] || [ -z "${sha:-}" ]; then
            echo "::warning::Wiki pull request #$PR_NUMBER was not merged within 3 minutes (state: ${state:-unknown}), so the merge commit gets no push summary."
            exit 0
          fi
          git fetch --no-tags --depth=2 origin "$sha"
          parent=$(git rev-parse "$sha^")
          GITHUB_SHA="$sha" BEFORE_SHA="$parent" node scripts/droid-push-review.mjs
