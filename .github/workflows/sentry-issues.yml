name: Sentry issues

# Copies new unresolved Sentry issues into GitHub issues, once per Sentry short id.
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentry-issues
  cancel-in-progress: false

jobs:
  sync:
    name: Sync issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Create GitHub issues for new Sentry issues
        env:
          SENTRY_API_TOKEN: ${{ secrets.SENTRY_API_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sentry-issues.mjs
